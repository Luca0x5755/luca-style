# 驗證通過後才把樣張部署到 GitHub Pages。
# 前提：repo Settings → Pages 的來源需設為「GitHub Actions」。
# 所有 action 皆固定到 commit SHA（行尾註解為對應的發行版本），不使用浮動標籤。
name: Deploy Pages

on:
  push:
    branches: [main]

# 預設只讀取程式碼；部署所需的寫入權限只給 deploy job。
permissions:
  contents: read

# 同時只部署一次，且不中斷進行中的部署。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 以下四項任一失敗，deploy job 就不會執行，線上維持上一版。
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # 部署內容：base 為 /luca-style/ 的 build:pages 輸出（刻意在測試後明確再建一次，產物來源一目了然）。
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/showcase/dist-pages

  # 截圖比對：與本機 npm run test:visual 使用同一個官方 Linux 映像（版本須與 @playwright/test 一致，
  # tests/visual-config.spec.ts 會檢查）。container 是 job 層級設定，所以獨立成一個 job。
  visual:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      PW_VISUAL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run build
      - run: npx playwright test --project=visual --update-snapshots=none

  deploy:
    needs: [verify, visual]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
