<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Luca Style</title>
    <style>
      html { background:#F7F7F2; color-scheme:light; }
      html[data-mode="dark"] { background:#151A18; color-scheme:dark; }
    </style>
    <script>
      // 在外部樣式與應用程式載入前套用主題，避免切頁時露出白底。
      let preference;
      try { preference = localStorage.getItem('luca-style-mode'); } catch { /* 儲存不可用時跟隨系統。 */ }
      document.documentElement.dataset.mode = preference === 'light' || preference === 'dark'
        ? preference : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
