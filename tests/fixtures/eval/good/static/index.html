<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>評分工具的正向範例</title>
<style>
  :root { --bg: #ffffff; --text: #1a1a1a; }
  body { margin: 0; font: 16px/1.5 sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 100%; padding: 16px; box-sizing: border-box; }
</style>
</head>
<body>
<main>
  <h1>訂單管理</h1>
  <section id="region"></section>
</main>
<script>
  // 四種狀態都有標記，內容各不相同；狀態稍晚才出現，模擬非同步呈現。
  const state = new URLSearchParams(location.search).get('state') ?? 'success';
  const content = {
    loading: '<p role="status">載入中…</p>',
    empty: '<p>目前沒有訂單。</p>',
    error: '<p role="alert">載入失敗，請重試。</p>',
    success: '<table><caption>訂單</caption><tr><th scope="col">編號</th></tr><tr><td>A-1</td></tr></table>',
  }[state];
  setTimeout(() => {
    const region = document.getElementById('region');
    region.dataset.evalState = state;
    region.innerHTML = content;
  }, 300);
</script>
</body>
</html>
